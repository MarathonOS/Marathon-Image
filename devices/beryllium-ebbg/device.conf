# Xiaomi POCO F1 with EBBG Panel (beryllium-ebbg) Device Configuration

DEVICE_VENDOR="xiaomi"
DEVICE_CODENAME="beryllium-ebbg"
DEVICE_NAME="Xiaomi POCO F1 EBBG"
DEVICE_SOC="sdm845"
DEVICE_ARCH="aarch64"

# Kernel
KERNEL_CMDLINE="console=ttyMSM0,115200n8 mem_sleep_default=deep"
KERNEL_DTB="qcom/sdm845-xiaomi-beryllium-ebbg"
KERNEL_CONFIG_FRAGMENT="../sdm845/kernel-config.fragment"

# Bootloader
BOOTLOADER_TYPE="android"
FLASH_METHOD="fastboot"

# Partitions
BOOT_PARTITION="boot"
SYSTEM_PARTITION="userdata"

# Hardware notes
# - EBBG Panel, Focaltech touchscreen
# - RAM: 6/8 GB LPDDR4X
# - Storage: 64/128/256 GB UFS 2.1
# - Display: 6.18" 1080x2246 IPS LCD, 60Hz
# - GPU: Adreno 630
# - Modem: Snapdragon X20 LTE
# - WiFi: Qualcomm WCN3990 (802.11ac)
# - Bluetooth: 5.0


